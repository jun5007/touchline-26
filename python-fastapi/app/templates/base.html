<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111d">
  <meta name="description" content="{% block description %}실제 월드컵 경기 데이터로 감독의 결정을 설계하고 검증하는 인터랙티브 전술 웹서비스{% endblock %}">
  <title>{% block title %}TOUCHLINE 26{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/styles.css">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip-link" href="#main-content">본문으로 바로가기</a>
  <div class="site-shell">
    <header class="site-header">
      <div class="page-wrap site-header__inner">
        <a class="brand" href="/" aria-label="TOUCHLINE 26 홈">
          <span class="brand__crest" aria-hidden="true"><span>26</span></span>
          <span class="brand__wordmark">TOUCHLINE <b>26</b></span>
        </a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-nav">
          <span class="sr-only">메뉴 열기</span>
          <span></span><span></span><span></span>
        </button>
        <nav class="site-nav" id="primary-nav" aria-label="주 메뉴">
          <a href="/matches"{% if active_nav == 'matches' %} aria-current="page"{% endif %}>경기 선택</a>
          <a href="/about-data"{% if active_nav == 'data' %} aria-current="page"{% endif %}>데이터 기준</a>
          <span class="site-nav__live"><i aria-hidden="true"></i> PYTHON EDITION</span>
        </nav>
      </div>
    </header>

    <main id="main-content" tabindex="-1">
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <div class="page-wrap site-footer__inner">
        <a class="brand brand--small" href="/" aria-label="TOUCHLINE 26 홈">
          <span class="brand__crest" aria-hidden="true"><span>26</span></span>
          <span class="brand__wordmark">TOUCHLINE <b>26</b></span>
        </a>
        <p>실제 경기의 맥락 위에서, 당신만의 결정을 설계하세요.</p>
        <div class="site-footer__links">
          <a href="/about-data">출처와 산정 기준</a>
          <span aria-hidden="true">·</span>
          <span>FastAPI + Vanilla JS</span>
        </div>
      </div>
    </footer>
  </div>
  <div class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script src="/static/js/app.js" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
